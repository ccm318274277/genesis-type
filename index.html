<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创世之语 — Genesis</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Noto Serif SC',serif}
canvas{position:fixed;top:0;left:0;z-index:0}

#ui{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;pointer-events:none}

/* Intro overlay */
#intro{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity 1.5s}
#intro h1{font-size:56px;font-weight:300;color:#fff;letter-spacing:12px;margin-bottom:16px;opacity:0;animation:introFade 2s ease 0.5s forwards}
#intro p{font-size:16px;color:rgba(255,255,255,0.4);letter-spacing:4px;opacity:0;animation:introFade 2s ease 1.5s forwards}
#intro .start-hint{font-size:14px;color:rgba(255,255,255,0.25);letter-spacing:3px;margin-top:40px;opacity:0;animation:introFade 2s ease 2.5s forwards, pulse 2s ease-in-out 3s infinite}
@keyframes introFade{to{opacity:1}}
@keyframes pulse{0%,100%{opacity:0.25}50%{opacity:0.6}}

/* Input area */
#input-wrap{
  pointer-events:auto;width:90%;max-width:700px;margin-bottom:50px;position:relative;
}
#real-input{
  width:100%;padding:16px 24px;background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);border-radius:16px;
  color:#fff;font-size:28px;font-family:'Noto Serif SC',serif;
  letter-spacing:6px;text-align:center;outline:none;
  transition:border-color 0.3s,box-shadow 0.3s;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#real-input::placeholder{color:rgba(255,255,255,0.2);letter-spacing:4px;font-size:18px}
#real-input:focus{border-color:rgba(255,255,255,0.25);box-shadow:0 0 40px rgba(255,255,255,0.05)}

/* Keyword pills */
#pills{
  pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;
  gap:8px;margin-bottom:16px;max-width:700px;
}
.pill{
  padding:6px 16px;border-radius:20px;font-size:13px;letter-spacing:2px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.45);cursor:pointer;transition:all 0.3s;
  pointer-events:auto;
}
.pill:hover{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.8);border-color:rgba(255,255,255,0.2)}

/* Current word display */
#word-display{
  font-size:64px;font-weight:300;color:rgba(255,255,255,0.85);
  letter-spacing:12px;text-align:center;
  text-shadow:0 0 60px rgba(255,255,255,0.2),0 0 120px rgba(255,255,255,0.05);
  margin-bottom:40px;min-height:80px;
  transition:opacity 0.5s;pointer-events:none;
}

/* History sidebar */
#history{
  position:fixed;left:24px;top:50%;transform:translateY(-50%);z-index:20;
  display:flex;flex-direction:column;gap:6px;pointer-events:none;
}
.hist{font-size:12px;color:rgba(255,255,255,0.12);letter-spacing:2px;transition:all 0.5s}

/* Flash */
.flash{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;pointer-events:none;opacity:0;transition:opacity 0.4s}

/* Effect label */
#effect-label{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:120px;font-weight:300;color:rgba(255,255,255,0);
  pointer-events:none;z-index:15;transition:none;
}
</style>
</head>
<body>

<div id="intro" onclick="startApp()">
  <h1>创 世 之 语</h1>
  <p>你的文字，就是造物的咒语</p>
  <div class="start-hint">点 击 任 意 处 开 始</div>
</div>

<canvas id="c"></canvas>
<div class="flash" id="flash"></div>
<div id="effect-label"></div>

<div id="ui">
  <div id="word-display"></div>
  <div id="pills"></div>
  <div id="input-wrap">
    <input id="real-input" type="text" placeholder="在此输入文字，落笔即创世..." autocomplete="off" spellcheck="false">
  </div>
</div>

<div id="history"></div>

<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
let W, H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();
addEventListener('resize',resize);

// === World State ===
const ws = {
  sky:[8,8,18], ground:0, hasGround:false, stars:[], mountains:[], rain:[], snow:[],
  trees:[], fire:[], clouds:[], water:0, waterWave:0, wind:0, lightning:[],
  flowers:[], birds:[], sun:null, moon:null, fog:0, sakura:[], buildings:[],
  dark:0, light:0, t:0, particles:[], rainbow:false, road:false, person:null,
  groundColor:null, quake:0, history:[]
};

// Start with subtle stars so it's not pure black
function initScene(){
  for(let i=0;i<60;i++) ws.stars.push({x:Math.random()*W,y:Math.random()*H*0.85,s:Math.random()*1.5+0.3,tw:Math.random()*6.28,sp:Math.random()*0.015+0.005});
}

// === All creation functions ===
function mkGround(){ws.hasGround=true;ws.ground=H*0.78;if(ws.sky[0]+ws.sky[1]+ws.sky[2]<10)ws.sky=[15,20,35]}
function mkMountain(sm){
  if(!ws.hasGround)mkGround();
  for(let i=0;i<3+Math.random()*4|0;i++)
    ws.mountains.push({x:Math.random()*W,h:sm?80+Math.random()*100:150+Math.random()*250,w:sm?100+Math.random()*100:200+Math.random()*300,c:[30+Math.random()*20|0,35+Math.random()*20|0,45+Math.random()*20|0],snow:Math.random()>0.4});
  showEffect('山');
}
function mkSky(){ws.sky=[20,30,60];showEffect('天')}
function mkStars(){
  for(let i=0;i<80;i++) ws.stars.push({x:Math.random()*W,y:Math.random()*H*0.75,s:Math.random()*2+0.5,tw:Math.random()*6.28,sp:Math.random()*0.02+0.01});
  showEffect('星');
}
function mkRain(){
  for(let i=0;i<200;i++) ws.rain.push({x:Math.random()*W,y:Math.random()*H,sp:8+Math.random()*8,l:15+Math.random()*15});
  ws.sky=[10,12,18];mkCloud();showEffect('雨');
}
function mkSnow(){
  for(let i=0;i<120;i++) ws.snow.push({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*3,sp:0.5+Math.random()*1.5,wb:Math.random()*6.28,ws:0.01+Math.random()*0.02});
  showEffect('雪');
}
function mkTree(){
  if(!ws.hasGround)mkGround();
  for(let i=0;i<3+Math.random()*5|0;i++)
    ws.trees.push({x:50+Math.random()*(W-100),h:60+Math.random()*80,w:30+Math.random()*30,sw:0,ss:0.01+Math.random()*0.01,g:[20+Math.random()*30|0,80+Math.random()*60|0,20+Math.random()*30|0]});
  showEffect('树');
}
function mkFire(){
  if(!ws.hasGround)mkGround();
  const bx=W*0.3+Math.random()*W*0.4;
  for(let i=0;i<30;i++) ws.fire.push({x:bx+(Math.random()-0.5)*40,y:ws.ground,vx:(Math.random()-0.5)*2,vy:-(2+Math.random()*4),life:30+Math.random()*30,ml:60,s:3+Math.random()*5,bx:bx});
  showEffect('火');
}
function mkCloud(){
  for(let i=0;i<5;i++) ws.clouds.push({x:Math.random()*W,y:40+Math.random()*120,w:120+Math.random()*200,h:30+Math.random()*40,sp:0.2+Math.random()*0.3,o:0.1+Math.random()*0.15});
}
function mkOcean(){ws.water=H*0.55;ws.hasGround=false;ws.ground=H;ws.sky=[10,15,30];showEffect('海')}
function mkWater(){if(!ws.hasGround)mkGround();ws.water=ws.ground-10;showEffect('水')}
function mkLightning(){
  let x=Math.random()*W,y=0;const b=[];
  while(y<H*0.8){const nx=x+(Math.random()-0.5)*80,ny=y+20+Math.random()*40;b.push({x1:x,y1:y,x2:nx,y2:ny});if(Math.random()>0.7)b.push({x1:x,y1:y,x2:x+(Math.random()-0.5)*100,y2:y+30+Math.random()*50});x=nx;y=ny}
  ws.lightning.push({b:b,life:10});doFlash(0.8);mkCloud();showEffect('雷');
}
function mkFlower(){
  if(!ws.hasGround)mkGround();
  const colors=[[255,100,120],[255,180,80],[180,100,255],[255,255,100],[100,200,255],[255,150,200]];
  for(let i=0;i<20;i++) ws.flowers.push({x:30+Math.random()*(W-60),c:colors[Math.random()*6|0],s:4+Math.random()*6,sw:Math.random()*6.28});
  showEffect('花');
}
function mkBird(){for(let i=0;i<5;i++) ws.birds.push({x:Math.random()*W,y:50+Math.random()*150,sp:1+Math.random()*2,wp:Math.random()*6.28,s:8+Math.random()*8});showEffect('鸟')}
function mkSun(){ws.sun={x:W*0.75,y:H*0.15,s:50,gw:0};ws.sky=[30,50,90];ws.dark=Math.max(0,ws.dark-0.5);showEffect('日')}
function mkMoon(){ws.moon={x:W*0.7,y:H*0.12,s:40};ws.sky=[8,8,20];showEffect('月')}
function mkSakura(){for(let i=0;i<60;i++) ws.sakura.push({x:Math.random()*W,y:Math.random()*H,s:2+Math.random()*4,sp:0.5+Math.random()*1,wb:Math.random()*6.28,r:Math.random()*6.28});showEffect('樱')}
function mkCity(){
  if(!ws.hasGround)mkGround();
  for(let i=0;i<12;i++){const bw=30+Math.random()*50;ws.buildings.push({x:i*(W/12)+Math.random()*20,w:bw,h:80+Math.random()*200,c:[20+Math.random()*15|0,25+Math.random()*15|0,35+Math.random()*15|0]})}
  showEffect('城');
}
function mkRainbow(){ws.rainbow=true;showEffect('虹')}
function mkRoad(){if(!ws.hasGround)mkGround();ws.road=true;showEffect('路')}
function mkPerson(){if(!ws.hasGround)mkGround();ws.person={x:W*0.5};showEffect('人')}
function mkHeart(){
  for(let i=0;i<20;i++) ws.particles.push({x:W*0.3+Math.random()*W*0.4,y:H*0.5+Math.random()*100,vy:-(1+Math.random()*2),vx:(Math.random()-0.5),life:80+Math.random()*60,ml:140,type:'heart',s:10+Math.random()*14,c:[255,50+Math.random()*100|0,80+Math.random()*80|0]});
  showEffect('爱');
}
function fadeAll(){ws.trees=[];ws.flowers=[];ws.birds=[];ws.buildings=[];ws.person=null;ws.fire=[];ws.light=0}
function doExplode(){
  doFlash(1);
  for(let i=0;i<80;i++){const a=6.28/80*i,sp=2+Math.random()*6;ws.particles.push({x:W/2,y:H/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:40+Math.random()*40,ml:80,type:'spark',s:2+Math.random()*3,c:[255,150+Math.random()*100|0,Math.random()*100|0]})}
  ws.quake=15;showEffect('爆');
}

function doFlash(n){const f=document.getElementById('flash');f.style.background='#fff';f.style.transition='none';f.style.opacity=n;requestAnimationFrame(()=>{f.style.transition='opacity 0.5s';f.style.opacity='0'})}

function showEffect(char){
  const el=document.getElementById('effect-label');
  el.textContent=char;
  el.style.transition='none';
  el.style.color='rgba(255,255,255,0.25)';
  el.style.transform='translate(-50%,-50%) scale(1)';
  requestAnimationFrame(()=>{
    el.style.transition='all 2s ease-out';
    el.style.color='rgba(255,255,255,0)';
    el.style.transform='translate(-50%,-50%) scale(2)';
  });
}

// === Keyword map ===
const KW={
  '山':mkMountain,'峰':mkMountain,'丘':()=>mkMountain(1),
  '天':mkSky,'空':mkSky,
  '星':mkStars,'辰':mkStars,
  '雨':mkRain,'雪':mkSnow,
  '树':mkTree,'林':()=>{mkTree();mkTree()},'森':()=>{mkTree();mkTree();mkTree()},
  '火':mkFire,'焰':mkFire,
  '云':mkCloud,
  '海':mkOcean,'水':mkWater,'河':mkWater,'湖':mkWater,
  '风':()=>{ws.wind=3;showEffect('风')},
  '雷':mkLightning,'电':mkLightning,
  '花':mkFlower,'草':()=>{mkGround();ws.sky=[20,40,30];showEffect('草')},
  '鸟':mkBird,
  '日':mkSun,'阳':mkSun,
  '月':mkMoon,
  '夜':()=>{mkMoon();mkStars();ws.sky=[5,5,20];showEffect('夜')},
  '雾':()=>{ws.fog=0.5;showEffect('雾')},
  '樱':mkSakura,
  '城':mkCity,'楼':mkCity,
  '暗':()=>{ws.dark=0.7;showEffect('暗')},
  '黑':()=>{ws.dark=0.9;ws.sky=[0,0,0];showEffect('黑')},
  '光':()=>{ws.light=1;ws.dark=0;doFlash(0.3);showEffect('光')},
  '虹':mkRainbow,'彩':mkRainbow,
  '地':mkGround,'土':mkGround,
  '沙':()=>{ws.hasGround=true;ws.ground=H*0.72;ws.groundColor=[180,150,80];ws.sky=[60,40,20];mkSun();showEffect('沙')},
  '静':()=>{ws.wind=0;ws.rain=[];ws.snow=[];showEffect('静')},
  '震':()=>{ws.quake=10;showEffect('震')},
  '爆':doExplode,
  '春':()=>{mkSun();mkFlower();mkTree();mkBird();ws.sky=[40,60,90];showEffect('春')},
  '夏':()=>{mkSun();ws.sky=[20,50,100];mkCloud();showEffect('夏')},
  '秋':()=>{ws.sky=[50,30,20];mkSakura();mkMountain();showEffect('秋')},
  '冬':()=>{mkSnow();ws.sky=[15,15,25];ws.fog=0.3;showEffect('冬')},
  '梦':()=>{ws.sky=[20,10,40];mkStars();ws.fog=0.3;mkMoon();mkSakura();showEffect('梦')},
  '爱':mkHeart,'心':mkHeart,
  '死':()=>{ws.dark=0.95;fadeAll();ws.sky=[0,0,0];showEffect('死')},
  '生':()=>{ws.light=1;mkFlower();mkTree();mkBird();doFlash(0.5);ws.sky=[30,50,80];showEffect('生')},
  '孤':()=>{fadeAll();ws.fog=0.5;ws.dark=0.3;showEffect('孤')},
  '独':()=>{ws.fog=0.6;showEffect('独')},
  '路':mkRoad,'人':mkPerson,
  '灭':()=>{fadeAll();showEffect('灭')},
  '寂':()=>{fadeAll();ws.fog=0.4;showEffect('寂')},
};

// === Input Handling ===
const input = document.getElementById('real-input');
const wordDisplay = document.getElementById('word-display');
const historyEl = document.getElementById('history');

let lastValue = '';

input.addEventListener('input', ()=>{
  const val = input.value;
  const added = val.slice(lastValue.length);
  lastValue = val;
  wordDisplay.textContent = val;

  for(const ch of added){
    if(KW[ch]) KW[ch]();
    burst(W/2+(Math.random()-0.5)*200, H/2);
  }
});

input.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    if(input.value.trim()){
      ws.history.push(input.value.trim());
      updateHistory();
    }
    input.value='';
    lastValue='';
    wordDisplay.textContent='';
  }
});

function updateHistory(){
  historyEl.innerHTML=ws.history.slice(-12).map(w=>'<div class="hist">'+w+'</div>').join('');
}

function burst(x,y){
  for(let i=0;i<6;i++) ws.particles.push({x:x+(Math.random()-0.5)*60,y:y+(Math.random()-0.5)*30,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,life:25+Math.random()*15,ml:40,type:'spark',s:2,c:[255,255,255]});
}

// === Pill suggestions ===
const pillWords = [
  {label:'山',desc:'山脉'},{label:'海',desc:'海洋'},{label:'雨',desc:'下雨'},
  {label:'雪',desc:'下雪'},{label:'星',desc:'星空'},{label:'月',desc:'月亮'},
  {label:'日',desc:'太阳'},{label:'火',desc:'火焰'},{label:'树',desc:'森林'},
  {label:'花',desc:'花朵'},{label:'春',desc:'春天'},{label:'梦',desc:'梦境'},
  {label:'城',desc:'城市'},{label:'爱',desc:'爱心'},{label:'雷',desc:'闪电'},
  {label:'爆',desc:'爆炸'},{label:'生',desc:'重生'},{label:'死',desc:'毁灭'},
];
const pillsEl = document.getElementById('pills');
pillsEl.innerHTML = pillWords.map(p=>'<div class="pill" data-char="'+p.label+'">'+p.label+' <span style="opacity:0.5;font-size:11px">'+p.desc+'</span></div>').join('');
pillsEl.addEventListener('click',e=>{
  const pill = e.target.closest('.pill');
  if(!pill)return;
  const ch = pill.dataset.char;
  input.value += ch;
  lastValue = input.value;
  wordDisplay.textContent = input.value;
  if(KW[ch]) KW[ch]();
  burst(W/2, H/2);
  input.focus();
});

// === Intro ===
let started = false;
function startApp(){
  if(started)return;
  started=true;
  const intro=document.getElementById('intro');
  intro.style.opacity='0';
  setTimeout(()=>{intro.style.display='none';input.focus()},1500);
  initScene();
}

// === RENDER ===
function render(){
  ws.t++;
  let sx=0,sy=0;
  if(ws.quake>0){sx=(Math.random()-0.5)*ws.quake;sy=(Math.random()-0.5)*ws.quake;ws.quake*=0.94;if(ws.quake<0.1)ws.quake=0}

  ctx.save();
  ctx.translate(sx,sy);

  // Sky gradient
  const s=ws.sky;
  const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'rgb('+s[0]+','+s[1]+','+s[2]+')');
  grd.addColorStop(1,'rgb('+Math.min(s[0]+10,255)+','+Math.min(s[1]+10,255)+','+Math.min(s[2]+5,255)+')');
  ctx.fillStyle=grd;
  ctx.fillRect(-20,-20,W+40,H+40);

  // Sun
  if(ws.sun){
    const sn=ws.sun;sn.gw+=0.02;
    const sg=ctx.createRadialGradient(sn.x,sn.y,0,sn.x,sn.y,sn.s*4);
    sg.addColorStop(0,'rgba(255,240,200,1)');sg.addColorStop(0.2,'rgba(255,200,100,0.6)');
    sg.addColorStop(0.5,'rgba(255,150,50,'+(0.15+0.05*Math.sin(sn.gw))+')');sg.addColorStop(1,'rgba(255,100,0,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sn.x,sn.y,sn.s*4,0,6.28);ctx.fill();
    ctx.fillStyle='#fff8e0';ctx.beginPath();ctx.arc(sn.x,sn.y,sn.s,0,6.28);ctx.fill();
  }

  // Moon
  if(ws.moon){
    const mn=ws.moon;
    const mg=ctx.createRadialGradient(mn.x,mn.y,0,mn.x,mn.y,mn.s*3);
    mg.addColorStop(0,'rgba(220,230,255,0.9)');mg.addColorStop(0.3,'rgba(180,200,255,0.2)');mg.addColorStop(1,'rgba(100,120,200,0)');
    ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mn.x,mn.y,mn.s*3,0,6.28);ctx.fill();
    ctx.fillStyle='rgba(220,230,255,0.95)';ctx.beginPath();ctx.arc(mn.x,mn.y,mn.s,0,6.28);ctx.fill();
  }

  // Stars
  ws.stars.forEach(st=>{st.tw+=st.sp;const a=0.3+0.7*Math.abs(Math.sin(st.tw));ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.beginPath();ctx.arc(st.x,st.y,st.s,0,6.28);ctx.fill()});

  // Clouds
  ws.clouds.forEach(c=>{c.x+=c.sp+ws.wind*0.3;if(c.x>W+c.w)c.x=-c.w;ctx.fillStyle='rgba(200,210,220,'+c.o+')';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(c.x+i*c.w*0.25,c.y+Math.sin(i*1.5)*10,c.h*(0.8+Math.sin(i)*0.3),0,6.28);ctx.fill()}});

  // Rainbow
  if(ws.rainbow){['#ff0000','#ff8800','#ffff00','#00cc00','#0066ff','#4400cc','#8800ff'].forEach((c,i)=>{ctx.strokeStyle=c;ctx.globalAlpha=0.2;ctx.lineWidth=8;ctx.beginPath();ctx.arc(W*0.5,H*0.8,250+i*10,Math.PI,0);ctx.stroke()});ctx.globalAlpha=1}

  // Mountains
  ws.mountains.forEach(m=>{
    const base=ws.hasGround?ws.ground:H;
    ctx.fillStyle='rgb('+m.c[0]+','+m.c[1]+','+m.c[2]+')';
    ctx.beginPath();ctx.moveTo(m.x-m.w/2,base);ctx.lineTo(m.x,base-m.h);ctx.lineTo(m.x+m.w/2,base);ctx.fill();
    if(m.snow){ctx.fillStyle='rgba(240,245,255,0.8)';const py=base-m.h;ctx.beginPath();ctx.moveTo(m.x-m.w*0.1,py+m.h*0.15);ctx.lineTo(m.x,py);ctx.lineTo(m.x+m.w*0.1,py+m.h*0.15);ctx.fill()}
  });

  // Buildings
  ws.buildings.forEach(b=>{
    const base=ws.hasGround?ws.ground:H;
    ctx.fillStyle='rgb('+b.c[0]+','+b.c[1]+','+b.c[2]+')';
    ctx.fillRect(b.x,base-b.h,b.w,b.h);
    for(let i=0;i<20;i++){const wx=b.x+4+(i%3)*((b.w-8)/3),wy=base-b.h+10+Math.floor(i/3)*18;ctx.fillStyle=Math.random()>0.3?'rgba(255,230,150,0.7)':'rgba(0,0,0,0.3)';ctx.fillRect(wx,wy,6,8)}
  });

  // Ground
  if(ws.hasGround){
    const gc=ws.groundColor||[25,35,20];
    const gg=ctx.createLinearGradient(0,ws.ground,0,H);
    gg.addColorStop(0,'rgb('+gc[0]+','+gc[1]+','+gc[2]+')');
    gg.addColorStop(1,'rgb('+Math.max(gc[0]-10,0)+','+Math.max(gc[1]-10,0)+','+Math.max(gc[2]-10,0)+')');
    ctx.fillStyle=gg;ctx.fillRect(-20,ws.ground,W+40,H-ws.ground+20);
  }

  // Road
  if(ws.road){ctx.fillStyle='#2a2a2a';ctx.fillRect(0,ws.ground-3,W,30);ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.setLineDash([20,15]);ctx.beginPath();ctx.moveTo(0,ws.ground+12);ctx.lineTo(W,ws.ground+12);ctx.stroke();ctx.setLineDash([])}

  // Trees
  ws.trees.forEach(t=>{
    t.sw+=t.ss;const s=Math.sin(t.sw+ws.wind)*(3+ws.wind);
    ctx.fillStyle='#3a2a1a';ctx.fillRect(t.x-4,ws.ground-t.h*0.4,8,t.h*0.4);
    ctx.fillStyle='rgb('+t.g[0]+','+t.g[1]+','+t.g[2]+')';ctx.beginPath();ctx.arc(t.x+s,ws.ground-t.h*0.4-t.w*0.6,t.w,0,6.28);ctx.fill();
    ctx.fillStyle='rgba('+(t.g[0]-10)+','+(t.g[1]+20)+','+(t.g[2]-5)+',0.8)';ctx.beginPath();ctx.arc(t.x+s-t.w*0.3,ws.ground-t.h*0.4-t.w*0.3,t.w*0.7,0,6.28);ctx.fill();
  });

  // Flowers
  ws.flowers.forEach(f=>{
    f.sw+=0.02;const sx=Math.sin(f.sw)*2;
    ctx.fillStyle='#3a5a2a';ctx.fillRect(f.x,ws.ground-f.s*3,2,f.s*3);
    ctx.fillStyle='rgb('+f.c[0]+','+f.c[1]+','+f.c[2]+')';
    for(let p=0;p<5;p++){const a=6.28/5*p+ws.t*0.005;ctx.beginPath();ctx.arc(f.x+sx+Math.cos(a)*f.s*0.6,ws.ground-f.s*3+Math.sin(a)*f.s*0.6,f.s*0.45,0,6.28);ctx.fill()}
    ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(f.x+sx,ws.ground-f.s*3,f.s*0.3,0,6.28);ctx.fill();
  });

  // Person
  if(ws.person){
    const px=ws.person.x,py=ws.ground;
    ctx.fillStyle='#e0c8a0';ctx.beginPath();ctx.arc(px,py-45,7,0,6.28);ctx.fill();
    ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(px,py-38);ctx.lineTo(px,py-15);ctx.moveTo(px-10,py-30);ctx.lineTo(px+10,py-30);
    ctx.moveTo(px,py-15);ctx.lineTo(px-8,py);ctx.moveTo(px,py-15);ctx.lineTo(px+8,py);ctx.stroke();
  }

  // Water
  if(ws.water>0){
    ctx.fillStyle='rgba(20,60,120,0.6)';ctx.beginPath();ctx.moveTo(-10,H+10);
    for(let i=0;i<=W;i+=10){const wv=Math.sin(i*0.02+ws.t*0.03)*5+Math.sin(i*0.01+ws.t*0.02)*3;ctx.lineTo(i,ws.water+wv)}
    ctx.lineTo(W+10,H+10);ctx.fill();
    ctx.fillStyle='rgba(40,100,180,0.3)';ctx.fillRect(-10,ws.water+8,W+20,H-ws.water);
  }

  // Fire
  ws.fire=ws.fire.filter(f=>f.life>0);
  ws.fire.forEach(f=>{
    f.x+=f.vx+(Math.random()-0.5);f.y+=f.vy*0.5;f.vy*=0.98;f.life--;
    const r=f.life/f.ml;
    ctx.fillStyle='rgba(255,'+(150*r+50|0)+','+(30*r|0)+','+(r*0.8)+')';
    ctx.beginPath();ctx.arc(f.x,f.y,f.s*r,0,6.28);ctx.fill();
    if(f.life<5){f.x=f.bx+(Math.random()-0.5)*40;f.y=ws.ground;f.vy=-(2+Math.random()*4);f.life=30+Math.random()*30}
  });

  // Rain
  ws.rain.forEach(r=>{r.y+=r.sp;r.x+=ws.wind;if(r.y>H){r.y=-10;r.x=Math.random()*W}if(r.x>W)r.x=0;ctx.strokeStyle='rgba(150,180,220,0.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x+ws.wind*0.5,r.y+r.l);ctx.stroke()});

  // Snow
  ws.snow.forEach(s=>{s.y+=s.sp;s.wb+=s.ws;s.x+=Math.sin(s.wb)*0.5+ws.wind*0.5;if(s.y>H){s.y=-5;s.x=Math.random()*W}if(s.x>W)s.x=0;if(s.x<0)s.x=W;ctx.fillStyle='rgba(255,255,255,0.8)';ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,6.28);ctx.fill()});

  // Sakura
  ws.sakura.forEach(s=>{s.y+=s.sp;s.wb+=0.02;s.r+=0.03;s.x+=Math.sin(s.wb)*0.8+ws.wind*0.5;if(s.y>H){s.y=-5;s.x=Math.random()*W}ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.r);ctx.fillStyle='rgba(255,180,200,0.7)';ctx.beginPath();ctx.ellipse(0,0,s.s,s.s*0.5,0,0,6.28);ctx.fill();ctx.restore()});

  // Birds
  ws.birds.forEach(b=>{b.x+=b.sp;b.wp+=0.08;if(b.x>W+20)b.x=-20;const wy=Math.sin(b.wp)*b.s*0.4;ctx.strokeStyle='rgba(40,40,40,0.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x-b.s,b.y+wy);ctx.quadraticCurveTo(b.x-b.s*0.3,b.y-Math.abs(wy)*0.5,b.x,b.y);ctx.quadraticCurveTo(b.x+b.s*0.3,b.y-Math.abs(wy)*0.5,b.x+b.s,b.y+wy);ctx.stroke()});

  // Lightning
  ws.lightning=ws.lightning.filter(l=>l.life>0);
  ws.lightning.forEach(l=>{l.life--;const a=l.life/10;ctx.strokeStyle='rgba(200,220,255,'+a+')';ctx.lineWidth=2;l.b.forEach(b=>{ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke()})});

  // Particles
  ws.particles=ws.particles.filter(p=>p.life>0);
  ws.particles.forEach(p=>{
    p.x+=(p.vx||0);p.y+=(p.vy||0);if(p.vy)p.vy+=0.02;p.life--;
    const a=p.life/(p.ml||60);
    if(p.type==='heart'){ctx.fillStyle='rgba('+p.c[0]+','+p.c[1]+','+p.c[2]+','+a+')';ctx.font=p.s+'px serif';ctx.fillText('♥',p.x,p.y)}
    else{ctx.fillStyle='rgba('+p.c[0]+','+p.c[1]+','+p.c[2]+','+a+')';ctx.beginPath();ctx.arc(p.x,p.y,p.s*a,0,6.28);ctx.fill()}
  });

  // Darkness
  if(ws.dark>0){ctx.fillStyle='rgba(0,0,0,'+ws.dark+')';ctx.fillRect(-20,-20,W+40,H+40)}

  // Light
  if(ws.light>0){ws.light*=0.98;ctx.fillStyle='rgba(255,250,230,'+(ws.light*0.1)+')';ctx.fillRect(-20,-20,W+40,H+40)}

  // Fog
  if(ws.fog>0){ctx.fillStyle='rgba(150,160,170,'+(ws.fog*0.3)+')';ctx.fillRect(-20,-20,W+40,H+40)}

  ctx.restore();
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
